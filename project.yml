name: IINAMobile
options:
  bundleIdPrefix: org.local.iinamobile
  deploymentTarget:
    iOS: "17.0"
packages:
  IINASMB2:
    path: Vendor/libsmb2
  MPVKit:
    path: Vendor/MPVKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  IINAMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes: [Fonts]
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: IINASMB2
        product: IINASMB2
      - package: MPVKit
        product: MPVKit-GPL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iinamobile.player
        PRODUCT_NAME: IINAMobile
        SWIFT_OBJC_BRIDGING_HEADER: App/IINAMobile-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: IINA Mobile
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: 将视频截图保存到照片图库。
        NSLocalNetworkUsageDescription: 连接 SMB 服务器和局域网投屏设备，并播放视频。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.movie, public.video, org.matroska.mkv, org.webmproject.webm, com.microsoft.windows-media-wmv, com.adobe.flash.video, com.real.realmedia]
          - CFBundleTypeName: Subtitles and other media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.subtitle, public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: video/x-matroska
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
              public.mime-type: video/webm
          - UTTypeIdentifier: com.microsoft.windows-media-wmv
            UTTypeDescription: Windows Media video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [wmv]
              public.mime-type: video/x-ms-wmv
          - UTTypeIdentifier: com.adobe.flash.video
            UTTypeDescription: Flash video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [flv]
              public.mime-type: video/x-flv
          - UTTypeIdentifier: com.real.realmedia
            UTTypeDescription: RealMedia video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [rm, rmvb]
              public.mime-type: application/vnd.rn-realmedia
  IINAMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: IINAMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IINAMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: IINAMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SMBQA:
    build:
      targets:
        IINAMobile: all
    test:
      environmentVariables:
        IINA_SMB_QA: "1"
      targets: [IINAMobileTests, IINAMobileUITests]
  IINAMobile:
    build:
      targets:
        IINAMobile: all
    run:
      config: Debug
      disableMainThreadChecker: false
      enableGPUValidationMode: false
    test:
      targets: [IINAMobileTests, IINAMobileUITests]
